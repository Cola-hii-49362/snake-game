<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --bg: #eef2f7;
    --panel: #ffffff;
    --ink: #1e293b;
    --ink-soft: #64748b;
    --line: #e2e8f0;
    --brand: #10b981;
    --brand-deep: #059669;
    --accent: #ef4444;
    --board: #0f172a;
    --shadow: 0 10px 30px rgba(15,23,42,.10), 0 2px 8px rgba(15,23,42,.06);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{ height: 100%; }
  body{
    margin: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px 14px calc(18px + env(safe-area-inset-bottom));
    user-select: none;
    overflow-x: hidden;
  }

  /* ---------- 顶部标题 ---------- */
  .topbar{
    width: min(92vw, 560px, 62dvh);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .title{
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .title .dot{
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #34d399, #059669);
    box-shadow: 0 0 0 4px rgba(16,185,129,.16);
  }
  .title small{
    font-size: 12px; font-weight: 600; color: var(--ink-soft); letter-spacing: 1.5px;
  }
  .diff-tag{
    font-size: 12px; font-weight: 700; color: var(--brand-deep);
    background: rgba(16,185,129,.12);
    border: 1px solid rgba(16,185,129,.25);
    padding: 3px 10px; border-radius: 999px;
  }

  /* ---------- 计分板 ---------- */
  .scores{
    width: min(92vw, 560px, 62dvh);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 12px;
    box-shadow: 0 2px 6px rgba(15,23,42,.05);
    display: flex; flex-direction: column; gap: 2px;
  }
  .card .k{ font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .8px; }
  .card .v{ font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .card .v.bump{ animation: bump .28s ease; }
  @keyframes bump{ 0%{transform:scale(1)} 40%{transform:scale(1.22); color: var(--brand-deep)} 100%{transform:scale(1)} }

  /* ---------- 棋盘 ---------- */
  .stage{
    position: relative;
    width: min(92vw, 560px, 62dvh);
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    background: var(--board);
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    touch-action: none;
  }
  canvas{ display: block; width: 100%; height: 100%; }

  /* ---------- 遮罩层 ---------- */
  .overlay{
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 22px;
    background: rgba(15,23,42,.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #f8fafc;
    transition: opacity .22s ease, visibility .22s ease;
  }
  .overlay[hidden]{ display: none; }
  .overlay.fade{ opacity: 0; visibility: hidden; }

  .ov-title{ font-size: 26px; font-weight: 800; letter-spacing: .5px; margin: 0; }
  .ov-sub{ font-size: 13px; color: #cbd5e1; line-height: 1.7; margin: 0; max-width: 340px; }
  .ov-score{ display: flex; gap: 22px; margin: 2px 0 4px; }
  .ov-score div{ display: flex; flex-direction: column; gap: 2px; }
  .ov-score span:first-child{ font-size: 11px; color: #94a3b8; letter-spacing: 1px; font-weight: 700; }
  .ov-score span:last-child{ font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .badge{
    font-size: 12px; font-weight: 800; letter-spacing: .5px;
    color: #052e1a; background: linear-gradient(135deg,#6ee7b7,#34d399);
    padding: 4px 12px; border-radius: 999px;
  }
  .badge.warn{
    color: #450a0a; background: linear-gradient(135deg,#fda4af,#f43f5e);
  }

  .btn{
    appearance: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700;
    color: #04231a;
    background: linear-gradient(135deg, #6ee7b7, #10b981);
    padding: 11px 26px;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(16,185,129,.35);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover{ transform: translateY(-1px); filter: brightness(1.04); }
  .btn:active{ transform: translateY(1px) scale(.98); box-shadow: 0 3px 10px rgba(16,185,129,.3); }

  .ghost{
    background: rgba(255,255,255,.08);
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: none;
    padding: 10px 22px;
  }
  .ghost:hover{ background: rgba(255,255,255,.14); }

  .diffs{ display: flex; gap: 8px; }
  .diff{
    cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700;
    color: #cbd5e1; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    padding: 8px 16px; border-radius: 10px;
    transition: all .15s ease;
  }
  .diff:hover{ background: rgba(255,255,255,.14); }
  .diff.on{
    color: #04231a;
    background: linear-gradient(135deg,#6ee7b7,#10b981);
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(16,185,129,.32);
  }

  /* ---------- 图例 ---------- */
  .legend{
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    font-size: 11px; color: #cbd5e1; font-weight: 700;
  }
  .legend span{ display: inline-flex; align-items: center; gap: 5px; }
  .legend i{ width: 10px; height: 10px; display: inline-block; border-radius: 3px; }
  .legend i.lg-po{ border-radius: 50%; background: linear-gradient(135deg,#a78bfa,#22d3ee); }
  .legend i.lg-ob{ background: linear-gradient(135deg,#64748b,#334155); }
  .legend i.lg-la{ background: linear-gradient(135deg,#fda4af,#f43f5e); }

  /* ---------- 提示条 ---------- */
  .toast{
    position: absolute;
    left: 50%; top: 14px;
    transform: translate(-50%, -14px);
    background: rgba(15,23,42,.9);
    border: 1px solid rgba(94,234,212,.35);
    color: #a7f3d0;
    font-size: 13px; font-weight: 800; letter-spacing: .5px;
    padding: 7px 16px; border-radius: 999px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    z-index: 5;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 工具栏 ---------- */
  .toolbar{
    width: min(92vw, 560px, 62dvh);
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .tool{
    cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line);
    padding: 9px 16px; border-radius: 11px;
    box-shadow: 0 2px 6px rgba(15,23,42,.05);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .14s ease;
  }
  .tool:hover{ border-color: #cbd5e1; transform: translateY(-1px); }
  .tool:active{ transform: translateY(0); }
  .tool .ico{ font-size: 14px; line-height: 1; }

  .hint{
    font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.8;
    max-width: min(92vw, 560px);
  }
  kbd{
    font-family: inherit; font-size: 11px; font-weight: 700;
    background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 6px; color: var(--ink);
  }

  /* ---------- 手机方向键 ---------- */
  .dpad{
    display: none;
    width: min(92vw, 260px);
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    margin-top: 2px;
  }
  .dpad button{
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 20px;
    box-shadow: 0 3px 8px rgba(15,23,42,.07);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: transform .1s ease, background .1s ease;
  }
  .dpad button:active{ background: #e6fbf3; transform: scale(.94); }
  .dpad .up{ grid-area: 1 / 2; }
  .dpad .left{ grid-area: 2 / 1; }
  .dpad .right{ grid-area: 2 / 3; }
  .dpad .down{ grid-area: 3 / 2; }

  @media (pointer: coarse){
    .dpad{ display: grid; }
  }
  @media (max-width: 420px){
    .title{ font-size: 18px; }
    .card .v{ font-size: 18px; }
    .ov-title{ font-size: 22px; }
    .legend{ gap: 10px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <h1 class="title"><span class="dot"></span>贪吃蛇 <small>SNAKE</small></h1>
    <span class="diff-tag" id="diffTag">普通</span>
  </div>

  <div class="scores">
    <div class="card"><span class="k">当前得分</span><span class="v" id="score">0</span></div>
    <div class="card"><span class="k">最高分</span><span class="v" id="best">0</span></div>
    <div class="card"><span class="k">长度</span><span class="v" id="len">3</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>

    <!-- 开始界面 -->
    <div class="overlay" id="ovStart">
      <p class="ov-title">准备好了吗？</p>
      <p class="ov-sub">吃掉红色果实让蛇变长。撞墙、撞自己或撞障碍都会结束。<br>
        蛇长到 <b>8 节</b>开启传送门，得分满 <b>8 分</b>后开始出现激光。</p>
      <div class="legend">
        <span><i class="lg-ob"></i>障碍物</span>
        <span><i class="lg-po"></i>传送门</span>
        <span><i class="lg-la"></i>激光</span>
      </div>
      <div class="diffs">
        <button class="diff" data-diff="easy">轻松</button>
        <button class="diff on" data-diff="normal">普通</button>
        <button class="diff" data-diff="hard">挑战</button>
      </div>
      <button class="btn" id="btnStart">开始游戏</button>
    </div>

    <!-- 暂停界面 -->
    <div class="overlay fade" id="ovPause" hidden>
      <p class="ov-title">已暂停</p>
      <p class="ov-sub">按 <kbd>空格</kbd> 或点击下方按钮继续</p>
      <button class="btn" id="btnResume">继续游戏</button>
    </div>

    <!-- 结束界面 -->
    <div class="overlay fade" id="ovOver" hidden>
      <span class="badge" id="badgeNew" hidden>新纪录！</span>
      <p class="ov-title">游戏结束</p>
      <p class="ov-sub" id="overReason"></p>
      <div class="ov-score">
        <div><span>本局得分</span><span id="finalScore">0</span></div>
        <div><span>最高分</span><span id="finalBest">0</span></div>
      </div>
      <button class="btn" id="btnAgain">再来一局</button>
      <button class="ghost btn" id="btnBackHome">换个难度</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool" id="btnPause"><span class="ico">⏸</span>暂停</button>
    <button class="tool" id="btnRestart"><span class="ico">↻</span>重开</button>
    <button class="tool" id="btnSound"><span class="ico">🔊</span>音效</button>
  </div>

  <div class="hint">
    方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向 · <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重开
  </div>

  <div class="dpad">
    <button class="up"    data-dir="up">▲</button>
    <button class="left"  data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down"  data-dir="down">▼</button>
  </div>

<script>
(function () {
  "use strict";

  /* ============ 常量与配置 ============ */
  const COLS = 20;
  const ROWS = 20;

  const DIFFICULTIES = {
    easy:   { label: "轻松", base: 175, min: 95, step: 4 },
    normal: { label: "普通", base: 140, min: 70, step: 5 },
    hard:   { label: "挑战", base: 105, min: 55, step: 4 }
  };

  /* 迷你玩法参数 */
  const FEATURES = {
    obstacles:      { easy: 6, normal: 8, hard: 10 },  // 各难度障碍物数量
    portalAtLength: 8,      // 蛇长达到该值开启传送门
    laserFromScore: 8,      // 得分达到该值后开始出现激光
    laserWarnMs:    1400,   // 激光预警时长
    laserFireMs:    520,    // 激光开火时长
    laserGapMs:     1600,   // 两道激光之间的间隔
    laserSafeDist:  3       // 激光生成时与蛇头的安全距离（格）
  };

  const BEST_KEY = "snake_best_v1";
  const SOUND_KEY = "snake_sound_v1";

  const REASONS = {
    wall:     "撞到了墙壁",
    self:     "撞到了自己的身体",
    obstacle: "撞上了障碍物",
    laser:    "被激光击中了"
  };

  /* ============ DOM ============ */
  const stage     = document.getElementById("stage");
  const cv        = document.getElementById("cv");
  const ctx       = cv.getContext("2d");
  const elScore   = document.getElementById("score");
  const elBest    = document.getElementById("best");
  const elLen     = document.getElementById("len");
  const elDiffTag = document.getElementById("diffTag");
  const elToast   = document.getElementById("toast");

  const ovStart = document.getElementById("ovStart");
  const ovPause = document.getElementById("ovPause");
  const ovOver  = document.getElementById("ovOver");
  const badgeNew = document.getElementById("badgeNew");
  const elFinalScore = document.getElementById("finalScore");
  const elFinalBest  = document.getElementById("finalBest");
  const elOverReason = document.getElementById("overReason");

  /* ============ 状态 ============ */
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };
  const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

  const game = {
    phase: "ready",     // ready | running | paused | over
    diff: "normal",
    snake: [],          // [{x,y}] 头在 index 0
    prevSnake: [],      // 上一步的位置，用于插值渲染
    dir: "right",
    queue: [],          // 待处理的方向输入
    food: { x: -1, y: -1 },
    score: 0,
    best: 0,
    stepMs: 140,
    acc: 0,
    alpha: 0,
    eatFlash: 0,

    // —— 迷你玩法状态 ——
    obstacles: [],      // [{x,y}] 静态障碍
    portals: [],        // [{x,y,color}] 传送门对
    portalOn: false,    // 传送门是否已激活
    laser: null,        // { orient:'h'|'v', idx, phase:'warn'|'fire', t }
    laserWait: 0,       // 距下一道激光的等待时间
    teleportFx: 0,      // 传送特效计时
    headDetached: false // 传送瞬间头部与身体断开渲染
  };

  let cell = 20;        // 每格像素（CSS px）
  let dpr = 1;

  /* ============ 音效（WebAudio，无需外部资源） ============ */
  let audioCtx = null;
  let soundOn = localStorage.getItem(SOUND_KEY) !== "0";

  function beep(freq, duration, type, volume) {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(volume || 0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* 静默失败即可 */ }
  }

  function sfxEat() {
    beep(660, 0.08, "triangle", 0.07);
    setTimeout(function () { beep(990, 0.10, "triangle", 0.05); }, 55);
  }
  function sfxTurn() { beep(340, 0.04, "square", 0.02); }
  function sfxOver() {
    beep(420, 0.16, "sawtooth", 0.06);
    setTimeout(function () { beep(300, 0.18, "sawtooth", 0.06); }, 130);
    setTimeout(function () { beep(180, 0.30, "sawtooth", 0.06); }, 280);
  }
  function sfxPortal() {
    beep(520, 0.07, "sine", 0.05);
    setTimeout(function () { beep(900, 0.13, "sine", 0.05); }, 60);
  }
  function sfxLaserWarn() { beep(1500, 0.05, "square", 0.028); }
  function sfxLaserFire() {
    beep(1200, 0.10, "sawtooth", 0.045);
    setTimeout(function () { beep(700, 0.12, "sawtooth", 0.035); }, 60);
  }

  /* ============ 提示条 ============ */
  let toastTimer = null;
  function showToast(text) {
    elToast.textContent = text;
    elToast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 1900);
  }

  /* ============ 尺寸自适应 ============ */
  function resize() {
    const rect = stage.getBoundingClientRect();
    const size = Math.max(160, Math.floor(rect.width));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(size * dpr);
    cv.height = Math.floor(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / COLS;
    draw();
  }

  /* ============ 地图生成 ============ */
  function key(x, y) { return x + "," + y; }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 当前所有被占用的格子（蛇 / 障碍 / 传送门 / 食物）
  function occupied() {
    const s = {};
    let i;
    for (i = 0; i < game.snake.length; i++) s[key(game.snake[i].x, game.snake[i].y)] = true;
    for (i = 0; i < game.obstacles.length; i++) s[key(game.obstacles[i].x, game.obstacles[i].y)] = true;
    for (i = 0; i < game.portals.length; i++) s[key(game.portals[i].x, game.portals[i].y)] = true;
    if (game.food.x >= 0) s[key(game.food.x, game.food.y)] = true;
    return s;
  }

  // 取所有空闲格子，pred 可选过滤
  function freeCells(pred) {
    const occ = occupied();
    const out = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (occ[key(x, y)]) continue;
        if (pred && !pred(x, y)) continue;
        out.push({ x: x, y: y });
      }
    }
    return out;
  }

  function placeObstacles() {
    const n = FEATURES.obstacles[game.diff] || 8;
    // 出生点周围留出安全区，避免一开局就贴脸
    const safe = {};
    for (let i = 0; i < game.snake.length; i++) {
      const c = game.snake[i];
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) safe[key(c.x + dx, c.y + dy)] = true;
      }
    }
    const cand = freeCells(function (x, y) { return !safe[key(x, y)]; });
    shuffle(cand);
    game.obstacles = cand.slice(0, Math.min(n, cand.length));
  }

  function placePortals() {
    const cand = freeCells(null);
    if (cand.length < 2) { game.portals = []; return; }
    let a = null, b = null;
    // 尽量让两个门离得远一些
    for (let tries = 0; tries < 300; tries++) {
      const p = cand[Math.floor(Math.random() * cand.length)];
      const q = cand[Math.floor(Math.random() * cand.length)];
      if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) >= 9) { a = p; b = q; break; }
    }
    if (!a) { a = cand[0]; b = cand[cand.length - 1]; }
    game.portals = [
      { x: a.x, y: a.y, color: "#a78bfa" },
      { x: b.x, y: b.y, color: "#22d3ee" }
    ];
  }

  /* ============ 游戏逻辑 ============ */
  function currentConfig() { return DIFFICULTIES[game.diff]; }

  function updateSpeed() {
    const cfg = currentConfig();
    const lv = Math.floor(game.score / 5);
    game.stepMs = Math.max(cfg.min, cfg.base - lv * cfg.step);
  }

  function resetGame(keepPhase) {
    const mid = Math.floor(ROWS / 2);
    game.snake = [
      { x: 6, y: mid },
      { x: 5, y: mid },
      { x: 4, y: mid }
    ];
    game.prevSnake = game.snake.map(function (s) { return { x: s.x, y: s.y }; });
    game.dir = "right";
    game.queue = [];
    game.score = 0;
    game.acc = 0;
    game.alpha = 0;
    game.eatFlash = 0;

    game.obstacles = [];
    game.portals = [];
    game.portalOn = false;
    game.laser = null;
    game.laserWait = FEATURES.laserGapMs;
    game.teleportFx = 0;
    game.headDetached = false;
    game.food = { x: -1, y: -1 };

    placeObstacles();
    updateSpeed();
    spawnFood();

    if (!keepPhase) game.phase = "ready";
    syncHud(true);
  }

  function spawnFood() {
    const cand = freeCells(null);
    if (!cand.length) { game.food = { x: -1, y: -1 }; return; }
    game.food = cand[Math.floor(Math.random() * cand.length)];
  }

  function pushDir(name) {
    if (game.phase === "ready" || game.phase === "over") return;
    const last = game.queue.length ? game.queue[game.queue.length - 1] : game.dir;
    if (name === last) return;                 // 同方向忽略
    if (name === OPPOSITE[last]) return;       // 禁止 180° 掉头
    if (game.queue.length >= 2) return;
    game.queue.push(name);
  }

  function isOnLaser(c) {
    const L = game.laser;
    if (!L || L.phase !== "fire") return false;
    return L.orient === "h" ? (c.y === L.idx) : (c.x === L.idx);
  }

  function step() {
    game.headDetached = false;

    // 取出本步方向
    if (game.queue.length) {
      const next = game.queue.shift();
      if (next !== OPPOSITE[game.dir]) {
        game.dir = next;
        sfxTurn();
      }
    }

    const d = DIRS[game.dir];
    const head = game.snake[0];
    const nx = head.x + d.x;
    const ny = head.y + d.y;

    // 撞墙
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver("wall"); return; }

    // 撞障碍物
    for (let i = 0; i < game.obstacles.length; i++) {
      if (game.obstacles[i].x === nx && game.obstacles[i].y === ny) { gameOver("obstacle"); return; }
    }

    const willEat = (nx === game.food.x && ny === game.food.y);

    // 撞自己（不吃食物时，尾巴这一格会移开，允许通过）
    const limit = willEat ? game.snake.length : game.snake.length - 1;
    for (let i = 0; i < limit; i++) {
      if (game.snake[i].x === nx && game.snake[i].y === ny) { gameOver("self"); return; }
    }

    game.prevSnake = game.snake.map(function (s) { return { x: s.x, y: s.y }; });
    game.snake.unshift({ x: nx, y: ny });

    // —— 传送门 ——
    if (game.portalOn) {
      for (let i = 0; i < game.portals.length; i++) {
        const p = game.portals[i];
        if (p.x === nx && p.y === ny) {
          const out = game.portals[1 - i];
          game.snake[0] = { x: out.x, y: out.y };
          // 让头部直接在出口出现，不要横跨棋盘做插值
          game.prevSnake[0] = { x: out.x, y: out.y };
          game.headDetached = true;
          game.teleportFx = 1;
          sfxPortal();
          break;
        }
      }
    }

    if (willEat) {
      game.score += 1;
      game.eatFlash = 1;
      sfxEat();
      updateSpeed();

      // 蛇长达标 → 开启传送门
      if (!game.portalOn && game.snake.length >= FEATURES.portalAtLength) {
        game.portalOn = true;
        placePortals();
        showToast("传送门已开启！");
      }

      spawnFood();
      syncHud();
    } else {
      game.snake.pop();
    }

    // —— 激光命中判定（只判定蛇头，保证公平）——
    if (isOnLaser(game.snake[0])) { gameOver("laser"); return; }
  }

  function gameOver(reason) {
    game.phase = "over";
    sfxOver();

    const isNew = game.score > game.best;
    if (isNew) {
      game.best = game.score;
      try { localStorage.setItem(BEST_KEY, String(game.best)); } catch (e) {}
    }
    syncHud();

    elFinalScore.textContent = game.score;
    elFinalBest.textContent = game.best;
    elOverReason.textContent = REASONS[reason] || "";
    badgeNew.hidden = !isNew;
    showOverlay(ovOver);
  }

  /* ============ 激光调度 ============ */
  function spawnLaser() {
    const head = game.snake[0];
    const orient = Math.random() < 0.5 ? "h" : "v";
    const total = orient === "h" ? ROWS : COLS;
    const pool = [];
    for (let i = 0; i < total; i++) {
      const dist = orient === "h" ? Math.abs(i - head.y) : Math.abs(i - head.x);
      if (dist >= FEATURES.laserSafeDist) pool.push(i);
    }
    if (!pool.length) { game.laserWait = FEATURES.laserGapMs; return; }
    game.laser = {
      orient: orient,
      idx: pool[Math.floor(Math.random() * pool.length)],
      phase: "warn",
      t: FEATURES.laserWarnMs
    };
    sfxLaserWarn();
  }

  function updateLaser(dt) {
    if (game.phase !== "running") return;

    if (game.laser) {
      game.laser.t -= dt;
      if (game.laser.t <= 0) {
        if (game.laser.phase === "warn") {
          game.laser.phase = "fire";
          game.laser.t = FEATURES.laserFireMs;
          sfxLaserFire();
        } else {
          game.laser = null;
          game.laserWait = FEATURES.laserGapMs;
        }
      }
      return;
    }

    if (game.score >= FEATURES.laserFromScore) {
      game.laserWait -= dt;
      if (game.laserWait <= 0) spawnLaser();
    }
  }

  /* ============ HUD ============ */
  function syncHud(silent) {
    const s = String(game.score);
    if (elScore.textContent !== s) {
      elScore.textContent = s;
      if (!silent) replayAnim(elScore);
    }
    elBest.textContent = game.best;
    elLen.textContent = game.snake.length;
  }

  function replayAnim(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  /* ============ 遮罩控制 ============ */
  function showOverlay(el) {
    [ovStart, ovPause, ovOver].forEach(function (o) {
      if (o === el) {
        o.hidden = false;
        requestAnimationFrame(function () { o.classList.remove("fade"); });
      } else {
        o.classList.add("fade");
        o.hidden = true;
      }
    });
  }
  function hideOverlays() {
    [ovStart, ovPause, ovOver].forEach(function (o) {
      o.classList.add("fade");
      o.hidden = true;
    });
  }

  /* ============ 渲染 ============ */
  function lerp(a, b, t) { return a + (b - a) * t; }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function segCenter(i, alpha) {
    const cur = game.snake[i];
    const prev = game.prevSnake[i] || game.prevSnake[game.prevSnake.length - 1] || cur;
    // 长度变化时（吃到食物）新尾巴不移动
    const px = (i < game.prevSnake.length) ? prev.x : cur.x;
    const py = (i < game.prevSnake.length) ? prev.y : cur.y;
    return {
      x: (lerp(px, cur.x, alpha) + 0.5) * cell,
      y: (lerp(py, cur.y, alpha) + 0.5) * cell
    };
  }

  function drawBoard(size) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, size, size);

    // 棋盘格纹理
    ctx.fillStyle = "rgba(255,255,255,.022)";
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    // 网格线
    ctx.strokeStyle = "rgba(148,163,184,.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, size);
      ctx.moveTo(0, p); ctx.lineTo(size, p);
    }
    ctx.stroke();
  }

  /* ---- 障碍物 ---- */
  function drawObstacles() {
    for (let i = 0; i < game.obstacles.length; i++) {
      const o = game.obstacles[i];
      const x = o.x * cell, y = o.y * cell;
      const pad = cell * 0.07;

      const g = ctx.createLinearGradient(x, y, x, y + cell);
      g.addColorStop(0, "#4b5a70");
      g.addColorStop(1, "#2b3648");

      roundRect(x + pad, y + pad, cell - pad * 2, cell - pad * 2, cell * 0.2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = "rgba(148,163,184,.5)";
      ctx.lineWidth = Math.max(1, cell * 0.05);
      ctx.stroke();

      // 顶部一道高光，看起来像有厚度的石块
      ctx.fillStyle = "rgba(255,255,255,.13)";
      roundRect(x + pad * 2.2, y + pad * 2.2, cell - pad * 4.4, cell * 0.14, cell * 0.06);
      ctx.fill();

      // 底部暗面
      ctx.fillStyle = "rgba(0,0,0,.28)";
      roundRect(x + pad * 2.2, y + cell - pad * 2.2 - cell * 0.12, cell - pad * 4.4, cell * 0.12, cell * 0.05);
      ctx.fill();
    }
  }

  /* ---- 传送门 ---- */
  function drawPortals(t) {
    if (!game.portalOn) return;
    for (let i = 0; i < game.portals.length; i++) {
      const p = game.portals[i];
      const cx = (p.x + 0.5) * cell;
      const cy = (p.y + 0.5) * cell;
      const r = cell * 0.35;
      const spin = t / 480 + i * Math.PI;

      // 光晕
      const glow = ctx.createRadialGradient(cx, cy, r * 0.25, cx, cy, cell * 1.0);
      glow.addColorStop(0, hexA(p.color, 0.4));
      glow.addColorStop(1, hexA(p.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, cell * 1.0, 0, Math.PI * 2); ctx.fill();

      // 外环
      ctx.strokeStyle = p.color;
      ctx.lineWidth = Math.max(1.5, cell * 0.11);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      // 两段旋转的弧
      ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.lineWidth = Math.max(1.2, cell * 0.075);
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.58, spin, spin + Math.PI * 0.62); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.58, spin + Math.PI, spin + Math.PI * 1.62); ctx.stroke();

      // 中心
      ctx.fillStyle = hexA(p.color, 0.6);
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.26, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---- 激光 ---- */
  function drawLaser(t) {
    const L = game.laser;
    if (!L) return;

    const size = COLS * cell;
    const horizontal = L.orient === "h";
    const pos = (L.idx + 0.5) * cell;
    const firing = L.phase === "fire";

    let alpha, width;
    if (firing) {
      alpha = 1;
      width = cell * 0.34;
    } else {
      const prog = 1 - Math.max(0, L.t) / FEATURES.laserWarnMs;   // 0 → 1 逐渐变粗
      alpha = 0.3 + Math.abs(Math.sin(t / 90)) * 0.45;
      width = Math.max(1.5, cell * 0.05 + prog * cell * 0.13);
    }

    const line = function () {
      ctx.beginPath();
      if (horizontal) { ctx.moveTo(0, pos); ctx.lineTo(size, pos); }
      else { ctx.moveTo(pos, 0); ctx.lineTo(pos, size); }
      ctx.stroke();
    };

    ctx.save();
    ctx.lineCap = "round";

    if (firing) {
      // 外层辉光
      ctx.shadowColor = "rgba(244,63,94,.95)";
      ctx.shadowBlur = cell * 1.3;
      ctx.strokeStyle = "rgba(244,63,94,.6)";
      ctx.lineWidth = width * 2.1;
      line();

      // 内层白热
      ctx.shadowBlur = cell * 0.6;
      ctx.strokeStyle = "rgba(255,241,242,.98)";
      ctx.lineWidth = width;
      line();
    } else {
      ctx.strokeStyle = "rgba(244,63,94," + alpha + ")";
      ctx.lineWidth = width;
      ctx.setLineDash([cell * 0.34, cell * 0.26]);
      line();
      ctx.setLineDash([]);

      // 两端的发射器
      const r = cell * 0.17;
      ctx.fillStyle = "rgba(244,63,94," + Math.min(1, alpha + 0.25) + ")";
      if (horizontal) {
        ctx.beginPath(); ctx.arc(cell * 0.5, pos, r, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(size - cell * 0.5, pos, r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(pos, cell * 0.5, r, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(pos, size - cell * 0.5, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawFood(t) {
    const f = game.food;
    if (f.x < 0) return;
    const cx = (f.x + 0.5) * cell;
    const cy = (f.y + 0.5) * cell;
    const pulse = 1 + Math.sin(t / 260) * 0.07;
    const r = cell * 0.32 * pulse;

    // 光晕
    const glow = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, cell * 1.15);
    glow.addColorStop(0, "rgba(239,68,68,.32)");
    glow.addColorStop(1, "rgba(239,68,68,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, cell * 1.15, 0, Math.PI * 2);
    ctx.fill();

    // 果身
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.15, cx, cy, r);
    g.addColorStop(0, "#fca5a5");
    g.addColorStop(0.45, "#ef4444");
    g.addColorStop(1, "#b91c1c");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath();
    ctx.arc(cx - r * 0.34, cy - r * 0.38, r * 0.24, 0, Math.PI * 2);
    ctx.fill();

    // 小叶子
    ctx.fillStyle = "#22c55e";
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.35, cy - r * 0.95, r * 0.42, r * 0.2, -0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    const n = game.snake.length;
    if (!n) return;

    const pts = [];
    for (let i = 0; i < n; i++) pts.push(segCenter(i, game.alpha));

    const head = pts[0];
    // 刚穿过传送门时，头部与身体断开，否则会拉出一条横跨棋盘的直线
    const body = (game.headDetached && pts.length > 1) ? pts.slice(1) : pts;
    const tail = body[body.length - 1];

    // 蛇身渐变（头 → 尾）
    const grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    grad.addColorStop(0, "#5eead4");
    grad.addColorStop(0.35, "#34d399");
    grad.addColorStop(1, "#0d9488");

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 外发光
    ctx.save();
    ctx.shadowColor = "rgba(45,212,191,.55)";
    ctx.shadowBlur = cell * 0.75;
    ctx.strokeStyle = grad;
    ctx.lineWidth = cell * 0.74;
    strokePath(body);
    ctx.restore();

    // 主体
    ctx.strokeStyle = grad;
    ctx.lineWidth = cell * 0.74;
    strokePath(body);

    // 内层高光，让身体更有立体感
    ctx.strokeStyle = "rgba(255,255,255,.16)";
    ctx.lineWidth = cell * 0.26;
    strokePath(body);

    // 蛇头
    const d = DIRS[game.dir];
    ctx.fillStyle = "#5eead4";
    ctx.beginPath();
    ctx.arc(head.x, head.y, cell * 0.40, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛（朝向当前方向）
    const ex = -d.y, ey = d.x;              // 垂直于前进方向
    const eyeOff = cell * 0.16;
    const fwd = cell * 0.12;
    const eyeR = Math.max(1.5, cell * 0.088);
    const pupR = Math.max(0.9, cell * 0.045);

    for (let s = -1; s <= 1; s += 2) {
      const bx = head.x + d.x * fwd + ex * eyeOff * s;
      const by = head.y + d.y * fwd + ey * eyeOff * s;
      ctx.fillStyle = "#f8fafc";
      ctx.beginPath(); ctx.arc(bx, by, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(bx + d.x * eyeR * 0.35, by + d.y * eyeR * 0.35, pupR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function strokePath(pts) {
    if (!pts || !pts.length) return;
    ctx.beginPath();
    if (pts.length === 1) {
      ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      // 用二次贝塞尔平滑折线，蛇身更顺滑
      const p = pts[i];
      const prev = pts[i - 1];
      ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + p.x) / 2, (prev.y + p.y) / 2);
    }
    const lastP = pts[pts.length - 1];
    ctx.lineTo(lastP.x, lastP.y);
    ctx.stroke();
  }

  function draw() {
    const size = COLS * cell;
    const t = performance.now();

    drawBoard(size);
    drawObstacles();
    drawPortals(t);
    drawLaser(t);
    drawFood(t);
    drawSnake();

    // 吃到食物时的一圈扩散光
    if (game.eatFlash > 0) {
      const h = segCenter(0, game.alpha);
      ctx.strokeStyle = "rgba(94,234,212," + (game.eatFlash * 0.5) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(h.x, h.y, cell * (0.6 + (1 - game.eatFlash) * 1.6), 0, Math.PI * 2);
      ctx.stroke();
    }

    // 传送时出口处的扩散环
    if (game.teleportFx > 0 && game.portals.length) {
      const h = segCenter(0, game.alpha);
      ctx.strokeStyle = "rgba(167,139,250," + (game.teleportFx * 0.8) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(h.x, h.y, cell * (0.4 + (1 - game.teleportFx) * 2.0), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* ============ 主循环 ============ */
  let lastT = 0;

  function frame(t) {
    if (!lastT) lastT = t;
    let dt = t - lastT;
    lastT = t;
    if (dt > 220) dt = 220;          // 切后台回来不要一次跳很多步

    if (game.phase === "running") {
      game.acc += dt;
      let guard = 0;
      while (game.acc >= game.stepMs && guard < 8) {
        game.acc -= game.stepMs;
        step();
        guard++;
        if (game.phase !== "running") { game.acc = 0; break; }
      }
      game.alpha = Math.min(1, game.acc / game.stepMs);
    } else {
      game.alpha = 0;
    }

    updateLaser(dt);

    if (game.eatFlash > 0) game.eatFlash = Math.max(0, game.eatFlash - dt / 260);
    if (game.teleportFx > 0) game.teleportFx = Math.max(0, game.teleportFx - dt / 420);

    draw();
    requestAnimationFrame(frame);
  }

  /* ============ 控制流程 ============ */
  function startGame() {
    resetGame(true);
    game.phase = "running";
    game.acc = 0;
    lastT = 0;
    hideOverlays();
    elToast.classList.remove("show");
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    beep(520, 0.09, "triangle", 0.05);
  }

  function togglePause() {
    if (game.phase === "running") {
      game.phase = "paused";
      showOverlay(ovPause);
    } else if (game.phase === "paused") {
      game.phase = "running";
      game.acc = 0;
      lastT = 0;
      hideOverlays();
    }
  }

  function goHome() {
    resetGame(false);
    showOverlay(ovStart);
  }

  /* ============ 事件绑定 ============ */
  const KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };

  window.addEventListener("keydown", function (e) {
    const k = e.key;

    if (k === " " || k === "Spacebar" || e.code === "Space") {
      e.preventDefault();
      if (game.phase === "running" || game.phase === "paused") togglePause();
      else if (game.phase === "ready" || game.phase === "over") startGame();
      return;
    }
    if (k === "r" || k === "R") { startGame(); return; }
    if (k === "Enter" && (game.phase === "ready" || game.phase === "over")) { startGame(); return; }

    const dir = KEYMAP[k];
    if (dir) {
      e.preventDefault();
      if (game.phase === "ready") { startGame(); }
      pushDir(dir);
    }
  }, { passive: false });

  // 手机方向键
  document.querySelectorAll(".dpad button").forEach(function (b) {
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (game.phase === "ready" || game.phase === "over") startGame();
      pushDir(b.getAttribute("data-dir"));
    });
  });

  // 触屏滑动
  let touchStart = null;
  stage.addEventListener("touchstart", function (e) {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  stage.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (game.phase === "ready" || game.phase === "over") startGame();
    if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? "right" : "left");
    else pushDir(dy > 0 ? "down" : "up");
  }, { passive: true });

  // 难度选择
  document.querySelectorAll(".diff").forEach(function (b) {
    b.addEventListener("click", function () {
      game.diff = b.getAttribute("data-diff");
      document.querySelectorAll(".diff").forEach(function (o) { o.classList.remove("on"); });
      b.classList.add("on");
      elDiffTag.textContent = currentConfig().label;
      resetGame(false);
      updateSpeed();
    });
  });

  // 按钮
  document.getElementById("btnStart").addEventListener("click", startGame);
  document.getElementById("btnResume").addEventListener("click", togglePause);
  document.getElementById("btnAgain").addEventListener("click", startGame);
  document.getElementById("btnBackHome").addEventListener("click", goHome);

  document.getElementById("btnPause").addEventListener("click", function () {
    if (game.phase === "running" || game.phase === "paused") togglePause();
    else if (game.phase === "ready") startGame();
  });

  document.getElementById("btnRestart").addEventListener("click", startGame);

  const btnSound = document.getElementById("btnSound");
  function renderSoundBtn() {
    btnSound.innerHTML = '<span class="ico">' + (soundOn ? "🔊" : "🔇") + "</span>" + (soundOn ? "音效" : "静音");
  }
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0"); } catch (e) {}
    renderSoundBtn();
    if (soundOn) beep(700, 0.08, "triangle", 0.05);
  });
  renderSoundBtn();

  // 切到后台自动暂停
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && game.phase === "running") togglePause();
  });

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ============ 启动 ============ */
  try { game.best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { game.best = 0; }
  elDiffTag.textContent = currentConfig().label;
  resetGame(false);
  syncHud(true);
  resize();
  showOverlay(ovStart);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
